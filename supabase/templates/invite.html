<!-- Invitation email. Paste the same body in the cloud project:
     Supabase → Authentication → Emails → Invite user.
     The link must keep this shape: the app handles it in /auth/confirm. -->
<div style="font-family: Arial, Helvetica, sans-serif; background: #0d3b54; padding: 32px 16px">
  <div style="max-width: 460px; margin: 0 auto; background: #f5ead3; border-radius: 16px; padding: 28px 24px; color: #2a1f14">
    <p style="margin: 0 0 6px; font-size: 13px; font-weight: bold; color: #6a5844">cromodex</p>
    <h1 style="margin: 0 0 14px; font-size: 24px; line-height: 1.2">Te han invitado a cromodex</h1>
    <p style="margin: 0 0 22px; font-size: 15px; line-height: 1.5">
      Es la mesa donde el grupo cambia sus cromos repetidos. Entra para elegir tu
      contraseña; el enlace caduca en 24 horas y solo sirve una vez.
    </p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite"
       style="display: inline-block; background: #0d3b54; color: #f5ead3; text-decoration: none; font-weight: bold; font-size: 16px; padding: 14px 22px; border-radius: 12px">
      Aceptar invitación
    </a>
    <p style="margin: 22px 0 0; font-size: 13px; line-height: 1.5; color: #6a5844">
      Si no esperabas este correo, ignóralo.
    </p>
  </div>
</div>
